---
# =========================================================
# GN SCALES — CPANEL GIT DEPLOY
#
# Two problems with the previous version, both silent:
#
#   1. `cp -R *` — a shell glob never matches dotfiles, so .htaccess
#      would have sat in the repository and never reached the server.
#   2. `cp` never removes anything. Rename a page and the old file
#      stays live and crawlable forever, competing with the new one.
#
# rsync --delete fixes both, and the excludes keep it from deleting the
# things that only exist on the server: the content, the enquiries, the
# uploaded images.
#
# Before the first run, check rsync exists on this host:
#     which rsync
# If it is missing, use the fallback block at the bottom instead.
# =========================================================
deployment:
  tasks:
    - export DEPLOYPATH=/home/gnscales/public_html

    - >-
      /usr/bin/rsync -a --delete
      --exclude '.git'
      --exclude '.gitattributes'
      --exclude '.gitignore'
      --exclude '.cpanel.yml'
      --exclude 'docs/'
      --exclude 'tools/'
      --exclude 'data/'
      --exclude 'assets/uploads/'
      ./ $DEPLOYPATH/

    # The deploy has just overwritten every .html with the repository's
    # copy. This writes the live content back over them, so anything
    # edited in /admin since the last commit survives the deploy.
    - /usr/local/bin/php $DEPLOYPATH/admin/rebuild.php || /usr/bin/php $DEPLOYPATH/admin/rebuild.php || true

    # data/ holds password hashes and every enquiry. Nothing else needs
    # to read it, so nothing else may.
    - /bin/chmod 700 $DEPLOYPATH/data || true
    - /bin/chmod 755 $DEPLOYPATH/assets/uploads || true

# --- If rsync is not available on this host --------------------------
# Replace the rsync line above with these three. `cp -R .` copies
# dotfiles, and the rm afterwards keeps the repository's own metadata out
# of the web root. It still will not delete a page you removed from the
# repository — you would have to do that by hand in File Manager.
#
#   - /bin/cp -R . $DEPLOYPATH/
#   - /bin/rm -rf $DEPLOYPATH/.git $DEPLOYPATH/.cpanel.yml $DEPLOYPATH/.gitattributes $DEPLOYPATH/.gitignore
#   - /bin/rm -rf $DEPLOYPATH/docs $DEPLOYPATH/tools
